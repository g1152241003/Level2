<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDGs性別平權 -情境題</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;800;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }

        /* 遊戲場景容器 */
        .park-canvas {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #3a7bd5 0%, #3a7bd5 20%, #6dd5ed 55%, #a8e063 55%, #56ab2f 100%);
            overflow: hidden;
        }

        /* 隨機花朵樣式與動畫 */
        .flower-btn {
            position: absolute;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s;
            cursor: pointer;
            animation: flowerFloat 3s infinite ease-in-out;
            z-index: 20;
        }

        .flower-btn:hover {
            transform: scale(1.25) rotate(10deg) !important;
            filter: drop-shadow(0 10px 15px rgba(255, 230, 0, 0.8));
        }

        .flower-btn.done {
            filter: grayscale(0.7) opacity(0.6);
            cursor: default;
            animation: none;
        }

        @keyframes flowerFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(6deg); }
        }

        /* Modal Pop 動畫 */
        @keyframes modalPop {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: modalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* 拖拉卡片樣式 */
        .drag-card {
            cursor: grab;
            touch-action: none;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .drag-card:active {
            cursor: grabbing;
            transform: scale(1.03);
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
        }

        /* Drop Zone Drag Over Highlight */
        .drop-zone.drag-over {
            border-style: solid !important;
            transform: scale(1.02);
            background-color: rgba(255, 255, 255, 0.95) !important;
        }

        /* 摩天輪旋轉動畫 */
        @keyframes ferrisRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .ferris-wheel-spin {
            transform-origin: 150px 150px;
            animation: ferrisRotate 40s linear infinite;
        }
        .ferris-cabin {
            transform-origin: center;
            animation: ferrisRotate 40s linear infinite reverse;
        }

        /* 熱氣球飄浮 */
        @keyframes balloonFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        .balloon-anim {
            animation: balloonFloat 6s ease-in-out infinite;
        }

        /* 五彩紙屑 Canvas */
        #confettiCanvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-800">

    <div id="gameCanvas" class="park-canvas flex flex-col justify-between">
        
        <!-- 頁首：左上標題 & 右上答對題數 -->
        <header class="relative z-30 w-full px-4 py-3 md:px-8 md:py-4 flex justify-between items-center bg-white/80 backdrop-blur-md border-b border-white/40 shadow-md">
            <!-- 左上方標題 -->
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 md:w-12 md:h-12 bg-rose-500 rounded-2xl flex items-center justify-center text-white text-xl md:text-2xl shadow-lg border-2 border-rose-300">
                    <i class="fas fa-ferris-wheel"></i>

                <div>

                </div>

            <!-- 右上方答對題數 -->
            <div class="flex items-center space-x-3">
                <div class="bg-amber-400 border-2 border-amber-300 px-4 py-2 rounded-2xl shadow-md flex items-center space-x-2">
                    <i class="fas fa-star text-white text-lg"></i>
                    <span id="scoreText" class="text-lg md:text-xl font-extrabold text-slate-900">

            </div>
        </header>

        <!-- 遊樂園向量背景設施 -->
        <svg class="absolute inset-0 w-full h-full pointer-events-none" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice">

            <!-- 熱氣球 -->

                <rect x="44" y="68" width="12" height="10" fill="#8d5524" rx="2"/>
                <line x1="38" y1="56" x2="44" y2="68" stroke="#333" stroke-width="1.5"/>
                <line x1="62" y1="56" x2="56" y2="68" stroke="#333" stroke-width="1.5"/>

                <rect x="15" y="100" width="45" height="80" fill="#f0d152"/>
                <rect x="140" y="100" width="45" height="80" fill="#f0d152"/>
                <polygon points="100,10 40,80 160,80" fill="#ff4757"/>
                <polygon points="37,30 15,100 60,100" fill="#2e86de"/>
                <polygon points="163,30 140,100 185,100" fill="#2e86de"/>
                <rect x="80" y="125" width="40" height="55" rx="20" fill="#576574"/>
                <line x1="100" y1="10" x2="100" y2="-10" stroke="#333" stroke-width="2"/>
                <polygon points="100,-10 125,-2 100,6" fill="#ffa502"/>
            </g>

            <!-- 摩天輪（左景） -->
            <g transform="translate(120, 210)">
                <!-- 腳架 -->
                <line x1="150" y1="150" x2="80" y2="330" stroke="#485460" stroke-width="10" stroke-linecap="round"/>
                <line x1="150" y1="150" x2="220" y2="330" stroke="#485460" stroke-width="10" stroke-linecap="round"/>
                <!-- 輪盤與支架 -->
                <g class="ferris-wheel-spin">
                    <circle cx="150" cy="150" r="120" fill="none" stroke="#ff6b6b" stroke-width="8"/>
                    <circle cx="150" cy="150" r="80" fill="none" stroke="#ffdda1" stroke-width="4"/>
                    <line x1="150" y1="30" x2="150" y2="270" stroke="#ff8e8e" stroke-width="4"/>
                    <line x1="30" y1="150" x2="270" y2="150" stroke="#ff8e8e" stroke-width="4"/>
                    <line x1="65" y1="65" x2="235" y2="235" stroke="#ff8e8e" stroke-width="4"/>
                    <line x1="65" y1="235" x2="235" y2="65" stroke="#ff8e8e" stroke-width="4"/>
                    <!-- 車廂 -->
                    <circle class="ferris-cabin" cx="150" cy="30" r="15" fill="#1e90ff"/>
                    <circle class="ferris-cabin" cx="270" cy="150" r="15" fill="#2ed573"/>
                    <circle class="ferris-cabin" cx="150" cy="270" r="15" fill="#ffa502"/>
                    <circle class="ferris-cabin" cx="30" cy="150" r="15" fill="#ff4757"/>
                    <circle class="ferris-cabin" cx="235" cy="65" r="15" fill="#9b59b6"/>
                    <circle class="ferris-cabin" cx="65" cy="235" r="15" fill="#e84393"/>
                    <circle class="ferris-cabin" cx="235" cy="235" r="15" fill="#00d2d3"/>
                    <circle class="ferris-cabin" cx="65" cy="65" r="15" fill="#ff6b6b"/>
                </g>
                <circle cx="150" cy="150" r="16" fill="#2f3542"/>
            </g>

            <!-- 雲霄飛車軌道（右景） -->
            <g transform="translate(750, 240)">
                <path d="M 0,180 Q 80,20 160,120 T 320,60 L 380,200" fill="none" stroke="#576574" stroke-width="6"/>
                <path d="M 0,180 Q 80,20 160,120 T 320,60 L 380,200" fill="none" stroke="#ff4757" stroke-width="4" stroke-dasharray="12,8"/>
                <!-- 支柱 -->
                <line x1="80" y1="80" x2="80" y2="250" stroke="#8395a7" stroke-width="4"/>
                <line x1="200" y1="120" x2="200" y2="250" stroke="#8395a7" stroke-width="4"/>
                <line x1="320" y1="60" x2="320" y2="250" stroke="#8395a7" stroke-width="4"/>
            </g>

            <!-- 旋轉木馬草棚（右下背景） -->
            <g transform="translate(880, 310)">
                <path d="M 10,80 L 100,10 L 190,80 Z" fill="#ff6b6b"/>
                <rect x="20" y="80" width="160" height="12" fill="#ffa502"/>
                <line x1="40" y1="92" x2="40" y2="160" stroke="#ccc" stroke-width="4"/>
                <line x1="100" y1="92" x2="100" y2="160" stroke="#ccc" stroke-width="4"/>
                <line x1="160" y1="92" x2="160" y2="160" stroke="#ccc" stroke-width="4"/>
                <rect x="10" y="160" width="180" height="15" fill="#ff6b6b" rx="4"/>
            </g>
        </svg>

        <!-- 下半部：隨機花朵動態放置區域 -->
        <div id="flowerContainer" class="relative w-full h-[50vh] z-20 pointer-events-none">
            <!-- 3 個花朵將由 JavaScript 隨機定位生成至此 -->
        </div>

        <!-- 浮動提示 -->
        <div class="relative z-20 mb-4 text-center pointer-events-none">
            <span class="bg-slate-900/80 backdrop-blur-md text-white text-xs md:text-sm px-4 py-2 rounded-full border border-amber-400 shadow-xl inline-flex items-center gap-2">
                <i class="fas fa-seedling text-amber-300"></i>
                <span>請點擊草地上的 <b>3 個花朵</b>，完成性別平權情境卡片分類！</span>
            </span>
        </div>
    </div>

    <!-- 題組彈窗 Modal -->
    <div id="quizModal" class="fixed inset-0 bg-slate-950/75 backdrop-blur-sm z-50 flex items-center justify-center p-3 md:p-6 hidden">
        <div class="bg-white border-4 border-amber-400 rounded-3xl max-w-3xl w-full p-5 md:p-7 shadow-2xl animate-pop relative flex flex-col max-h-[92vh] overflow-y-auto">
            
            <!-- Modal 頂欄 -->
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <div class="flex items-center space-x-2">
                    <span id="flowerGroupBadge" class="bg-rose-500 text-white font-black text-xs md:text-sm px-3 py-1 rounded-full">
                        🌸 題組 1
                    </span>
                    <h3 class="font-black text-slate-800 text-base md:text-lg">情境概念分類</h3>
                </div>
                <button onclick="closeQuizModal()" class="text-slate-400 hover:text-slate-700 text-2xl p-1 transition">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <p class="text-xs md:text-sm text-slate-600 mb-4 font-semibold">
                請將下方 2 個卡片分別<b class="text-rose-600">拖拉</b>至「性別平等」或「性別不平等」的區域框中：
            </p>

            <!-- 待拖拉卡片源區 -->
            <div id="cardSource" class="bg-slate-100 p-4 rounded-2xl border-2 border-dashed border-slate-300 min-h-[110px] flex flex-wrap gap-3 justify-center items-center mb-6" ondragover="handleAllowDrop(event)" ondrop="handleDropToSource(event)">
                <!-- 拖拉卡片動態載入 -->
            </div>

            <!-- 兩大分類框 Drop Zones -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <!-- 性別平等框 -->
                <div class="drop-zone equal border-3 border-dashed border-emerald-400 bg-emerald-50/70 p-4 rounded-2xl flex flex-col min-h-[170px] transition-all"
                     ondragover="handleAllowDrop(event)" ondragleave="handleDragLeave(event)" ondrop="handleDropToZone(event, 'equal')">
                    <div class="flex items-center space-x-2 text-emerald-700 font-black text-base md:text-lg mb-3">
                        <i class="fas fa-circle-check text-emerald-500"></i>
                        <span>性別平等</span>
                    </div>
                    <div id="zoneEqual" class="flex-grow flex flex-col gap-2"></div>
                </div>

                <!-- 性別不平等框 -->
                <div class="drop-zone unequal border-3 border-dashed border-rose-400 bg-rose-50/70 p-4 rounded-2xl flex flex-col min-h-[170px] transition-all"
                     ondragover="handleAllowDrop(event)" ondragleave="handleDragLeave(event)" ondrop="handleDropToZone(event, 'unequal')">
                    <div class="flex items-center space-x-2 text-rose-700 font-black text-base md:text-lg mb-3">
                        <i class="fas fa-triangle-exclamation text-rose-500"></i>
                        <span>性別不平等</span>
                    </div>
                    <div id="zoneUnequal" class="flex-grow flex flex-col gap-2"></div>
                </div>
            </div>

            <!-- 提交按鈕 -->
            <button onclick="submitGroupAnswer()" class="w-full py-3.5 bg-amber-400 hover:bg-amber-500 text-slate-900 font-black text-lg rounded-2xl shadow-lg transition active:scale-95 flex items-center justify-center gap-2">
                <i class="fas fa-paper-plane"></i>
                <span>確認送出答題</span>
            </button>
        </div>
    </div>

    <!-- 結局評定 Modal（網頁正中間） -->
    <div id="resultModal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white border-8 border-amber-300 rounded-3xl max-w-md w-full p-6 md:p-8 shadow-2xl text-center animate-pop relative overflow-hidden">
            
            <!-- 等級圖示 -->
            <div id="rankIconBg" class="w-24 h-24 mx-auto rounded-full flex items-center justify-center mb-4 text-4xl shadow-xl border-4">
                <i id="rankIcon" class="fas"></i>
            </div>

            <!-- 等級名稱 -->
            <h2 id="rankTitle" class="text-3xl md:text-4xl font-black mb-2 text-slate-800">
                評定等級
            </h2>

            <!-- 結算敘述 -->
            <p id="rankDesc" class="text-slate-600 font-semibold text-sm md:text-base mb-6 leading-relaxed">
                測驗結果說明...
            </p>

            <!-- 得分摘要 -->
            <div class="bg-slate-100 rounded-2xl p-4 mb-6 flex justify-around items-center border border-slate-200">
                <div>
                    <div class="text-xs text-slate-500 font-bold">總答對題數</div>
                    <div id="finalScoreText" class="text-3xl font-black text-rose-500">0 / 6</div>
                </div>
                <div class="h-8 w-px bg-slate-300"></div>
                <div>
                    <div class="text-xs text-slate-500 font-bold">挑戰目標</div>
                    <div class="text-3xl font-black text-emerald-500">6 / 6</div>
                </div>
            </div>

            <!-- 動態按鈕區 -->
            <div id="resultActionBox" class="flex flex-col gap-3">
                <!-- 按鈕由 JS 動態嵌入 -->
            </div>
        </div>
    </div>

    <!-- 滿分彩帶 Canvas -->
    <canvas id="confettiCanvas"></canvas>

    <script>
        // 3 個花朵對應的題組資料 (共 6 題)
        const questionGroups = [
            {
                groupId: 1,
                groupName: "🌸 題組一：遊樂園職場與分工情境",
                items: [
                    { id: "q1", text: "遊樂園招募員工時，不論性別均依專業能力平等錄取與定薪。", correct: "equal" },
                    { id: "q2", text: "認為女性比較細心，因此要求女性員工必須優先請假在家照顧小孩。", correct: "unequal" }
                ]
            },
            {
                groupId: 2,
                groupName: "🌼 題組二：設施體驗與情感表達",
                items: [
                    { id: "q3", text: "鼓勵男孩子如果搭乘設施感到害怕也可以勇敢哭出來，表達真實情緒。", correct: "equal" },
                    { id: "q4", text: "對不敢搭乘雲霄飛車的男生嘲諷：「你是不是男人啊？真膽小！」", correct: "unequal" }
                ]
            },
            {
                groupId: 3,
                groupName: "🌺 題組三：自由選擇與角色期待",
                items: [
                    { id: "q5", text: "支持男生自由選擇粉紅色飾品、購買玩偶，尊重個人興趣喜好。", correct: "equal" },
                    { id: "q6", text: "主張搬運遊樂園重物或粗重維修工作必須全部由男性員工包辦。", correct: "unequal" }
                ]
            }
        ];

        let totalCorrectCount = 0;
        let completedGroupsCount = 0;
        let activeGroupIndex = null;
        let userAssignments = {}; // { q1: "equal", q2: "unequal" }

        // 音效系統 (Web Audio API)
        function playSfx(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                const now = ctx.currentTime;

                if (type === 'click') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(450, now);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now); osc.stop(now + 0.08);
                } else if (type === 'win') {
                    [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                        const o = ctx.createOscillator();
                        const g = ctx.createGain();
                        o.connect(g); g.connect(ctx.destination);
                        o.frequency.value = freq;
                        g.gain.setValueAtTime(0.15, now + i * 0.12);
                        g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.3);
                        o.start(now + i * 0.12); o.stop(now + i * 0.12 + 0.3);
                    });
                }
            } catch (e) {}
        }

        // 頁面載入後隨機配置花朵
        window.addEventListener('load', () => {
            initRandomFlowers();
            initTouchSupport();
        });

        // 隨機產生 3 個花朵於下半部
        function initRandomFlowers() {
            const container = document.getElementById('flowerContainer');
            container.innerHTML = '';

            const flowerSvgs = [
                // Flower 1
                `<svg viewBox="0 0 100 100" class="w-16 h-16 md:w-20 md:h-20 drop-shadow-lg">
                    <circle cx="50" cy="20" r="18" fill="#ff4757"/><circle cx="80" cy="50" r="18" fill="#ff4757"/>
                    <circle cx="50" cy="80" r="18" fill="#ff4757"/><circle cx="20" cy="50" r="18" fill="#ff4757"/>
                    <circle cx="50" cy="50" r="20" fill="#ffa502"/>
                </svg>`,
                // Flower 2
                `<svg viewBox="0 0 100 100" class="w-16 h-16 md:w-20 md:h-20 drop-shadow-lg">
                    <circle cx="50" cy="20" r="18" fill="#ff781f"/><circle cx="80" cy="50" r="18" fill="#ff781f"/>
                    <circle cx="50" cy="80" r="18" fill="#ff781f"/><circle cx="20" cy="50" r="18" fill="#ff781f"/>
                    <circle cx="50" cy="50" r="20" fill="#fff200"/>
                </svg>`,
                // Flower 3
                `<svg viewBox="0 0 100 100" class="w-16 h-16 md:w-20 md:h-20 drop-shadow-lg">
                    <circle cx="50" cy="20" r="18" fill="#e84393"/><circle cx="80" cy="50" r="18" fill="#e84393"/>
                    <circle cx="50" cy="80" r="18" fill="#e84393"/><circle cx="20" cy="50" r="18" fill="#e84393"/>
                    <circle cx="50" cy="50" r="20" fill="#fecb2f"/>
                </svg>`
            ];

            // 將下半部水平寬度劃分為 3 等分
            const containerWidth = window.innerWidth;
            const containerHeight = container.clientHeight || (window.innerHeight * 0.45);
            const segmentWidth = containerWidth / 3;

            questionGroups.forEach((group, index) => {
                const flowerDiv = document.createElement('div');
                flowerDiv.id = `flower-${index}`;
                flowerDiv.className = 'flower-btn pointer-events-auto flex flex-col items-center group';
                
                // 隨機計算 X (對應分區內) & Y (下半部區域內)
                const minX = index * segmentWidth + 30;
                const maxX = (index + 1) * segmentWidth - 90;
                const randomX = Math.floor(Math.random() * Math.max(10, maxX - minX)) + minX;

                const minY = 20;
                const maxY = Math.max(40, containerHeight - 110);
                const randomY = Math.floor(Math.random() * (maxY - minY)) + minY;

                flowerDiv.style.left = `${randomX}px`;
                flowerDiv.style.top = `${randomY}px`;
                flowerDiv.onclick = () => openQuizModal(index);

                flowerDiv.innerHTML = `
                    <div class="bg-rose-500 text-white font-extrabold text-xs px-2.5 py-0.5 rounded-full shadow-md border border-white mb-1">
                        花朵 #${index + 1}
                    </div>
                    ${flowerSvgs[index % flowerSvgs.length]}
                `;

                container.appendChild(flowerDiv);
            });
        }

        // 開啟題組彈窗 Modal
        function openQuizModal(groupIndex) {
            playSfx('click');
            const flowerElem = document.getElementById(`flower-${groupIndex}`);
            if (flowerElem.classList.contains('done')) return;

            activeGroupIndex = groupIndex;
            const group = questionGroups[groupIndex];

            document.getElementById('flowerGroupBadge').innerText = group.groupName;

            const cardSource = document.getElementById('cardSource');
            const zoneEqual = document.getElementById('zoneEqual');
            const zoneUnequal = document.getElementById('zoneUnequal');

            cardSource.innerHTML = '';
            zoneEqual.innerHTML = '';
            zoneUnequal.innerHTML = '';
            userAssignments = {};

            // 打亂卡片順序
            const shuffledItems = [...group.items].sort(() => Math.random() - 0.5);

            shuffledItems.forEach(item => {
                const card = document.createElement('div');
                card.id = item.id;
                card.className = 'drag-card bg-white border-2 border-amber-400 p-3.5 rounded-xl shadow-md text-slate-800 font-bold text-xs md:text-sm text-center max-w-md w-full';
                card.draggable = true;
                card.innerText = item.text;

                card.ondragstart = (e) => {
                    e.dataTransfer.setData('text/plain', item.id);
                };

                cardSource.appendChild(card);
            });

            document.getElementById('quizModal').classList.remove('hidden');
        }

        function closeQuizModal() {
            playSfx('click');
            document.getElementById('quizModal').classList.add('hidden');
        }

        // Drag & Drop 邏輯
        function handleAllowDrop(e) {
            e.preventDefault();
            const dropZone = e.currentTarget.closest('.drop-zone');
            if (dropZone) {
                dropZone.classList.add('drag-over');
            }
        }

        function handleDragLeave(e) {
            const dropZone = e.currentTarget.closest('.drop-zone');
            if (dropZone) {
                dropZone.classList.remove('drag-over');
            }
        }

        function handleDropToZone(e, zoneType) {
            e.preventDefault();
            const dropZone = e.currentTarget.closest('.drop-zone');
            if (dropZone) dropZone.classList.remove('drag-over');

            const cardId = e.dataTransfer.getData('text/plain');
            const cardElem = document.getElementById(cardId);

            if (cardElem) {
                const targetSlot = (zoneType === 'equal') ? document.getElementById('zoneEqual') : document.getElementById('zoneUnequal');
                targetSlot.appendChild(cardElem);
                userAssignments[cardId] = zoneType;
                playSfx('click');
            }
        }

        function handleDropToSource(e) {
            e.preventDefault();
            const cardId = e.dataTransfer.getData('text/plain');
            const cardElem = document.getElementById(cardId);
            if (cardElem) {
                document.getElementById('cardSource').appendChild(cardElem);
                delete userAssignments[cardId];
                playSfx('click');
            }
        }

        // 提交當前花朵題組的答題
        function submitGroupAnswer() {
            const group = questionGroups[activeGroupIndex];

            if (Object.keys(userAssignments).length < group.items.length) {
                alert("請將所有卡片拖進「性別平等」或「性別不平等」的框中！");
                return;
            }

            let correctInGroup = 0;
            group.items.forEach(item => {
                if (userAssignments[item.id] === item.correct) {
                    correctInGroup++;
                }
            });

            totalCorrectCount += correctInGroup;
            completedGroupsCount++;

            // 更新右上角分數
            document.getElementById('scoreText').innerText = `答對題數：${totalCorrectCount} / 6`;

            // 標示花朵完成
            const flowerElem = document.getElementById(`flower-${activeGroupIndex}`);
            flowerElem.classList.add('done');

            closeQuizModal();

            // 6 題全部做答結束時進行結局評定
            if (completedGroupsCount === 3) {
                setTimeout(showFinalResultModal, 600);
            }
        }

        // 顯示結局評定 Modal (網頁正中間)
        function showFinalResultModal() {
            const modal = document.getElementById('resultModal');
            const rankIconBg = document.getElementById('rankIconBg');
            const rankIcon = document.getElementById('rankIcon');
            const rankTitle = document.getElementById('rankTitle');
            const rankDesc = document.getElementById('rankDesc');
            const finalScoreText = document.getElementById('finalScoreText');
            const actionBox = document.getElementById('resultActionBox');

            finalScoreText.innerText = `${totalCorrectCount} / 6`;
            actionBox.innerHTML = '';

            if (totalCorrectCount <= 3) {
                // 再加油 (0~3 題)
                rankIconBg.className = "w-24 h-24 mx-auto rounded-full flex items-center justify-center mb-4 text-4xl shadow-xl border-4 bg-rose-100 border-rose-400 text-rose-500";
                rankIcon.className = "fas fa-heart-crack";
                rankTitle.innerText = "再加油 級";
                rankTitle.className = "text-3xl md:text-4xl font-black mb-2 text-rose-600";
                rankDesc.innerText = `您在 6 個情境題中答對了 ${totalCorrectCount} 題。對性別平權概念仍有些混淆，點擊按鈕再次挑戰吧！`;

                actionBox.innerHTML = `
                    <button onclick="reloadGame()" class="w-full py-3.5 bg-gradient-to-r from-rose-500 to-pink-600 hover:from-rose-600 hover:to-pink-700 text-white font-black text-lg rounded-2xl shadow-lg transition transform active:scale-95 flex items-center justify-center gap-2">
                        <i class="fas fa-rotate-right"></i>
                        <span>再次挑戰</span>
                    </button>
                `;
            } else if (totalCorrectCount <= 5) {
                // 進步中 (4~5 題)
                rankIconBg.className = "w-24 h-24 mx-auto rounded-full flex items-center justify-center mb-4 text-4xl shadow-xl border-4 bg-amber-100 border-amber-400 text-amber-500";
                rankIcon.className = "fas fa-seedling";
                rankTitle.innerText = "進步中 級";
                rankTitle.className = "text-3xl md:text-4xl font-black mb-2 text-amber-600";
                rankDesc.innerText = `您在 6 個情境題中答對了 ${totalCorrectCount} 題！表現相當好，只差一點點就能獲得「平權達人」囉！`;

                actionBox.innerHTML = `
                    <button onclick="reloadGame()" class="w-full py-3.5 bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700 text-white font-black text-lg rounded-2xl shadow-lg transition transform active:scale-95 flex items-center justify-center gap-2">
                        <i class="fas fa-rotate-right"></i>
                        <span>再次挑戰</span>
                    </button>
                `;
            } else {
                // 平權達人 (6 題全對)
                playSfx('win');
                startConfetti();

                rankIconBg.className = "w-24 h-24 mx-auto rounded-full flex items-center justify-center mb-4 text-4xl shadow-xl border-4 bg-emerald-100 border-emerald-400 text-emerald-500";
                rankIcon.className = "fas fa-trophy animate-bounce";
                rankTitle.innerText = "平權達人 級";
                rankTitle.className = "text-3xl md:text-4xl font-black mb-2 text-emerald-600";
                rankDesc.innerText = `太完美了！6 題全對！您具備極高的性別平權觀察力與敏銳度，已達成最高榮譽！`;

                actionBox.innerHTML = `
                    <button onclick="downloadCertificate()" class="w-full py-3.5 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-black text-lg rounded-2xl shadow-lg transition transform active:scale-95 flex items-center justify-center gap-2">
                        <i class="fas fa-file-arrow-down"></i>
                        <span>下載學習證書</span>
                    </button>
                    <button onclick="reloadGame()" class="w-full py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold text-sm rounded-xl transition">
                        重新體驗網頁
                    </button>
                `;
            }

            modal.classList.remove('hidden');
        }

        function reloadGame() {
            window.location.reload();
        }

        // 下載學習證書 (Canvas 繪製生成 PNG 圖片)
        function downloadCertificate() {
            playSfx('click');
            const canvas = document.createElement('canvas');
            canvas.width = 1000;
            canvas.height = 700;
            const ctx = canvas.getContext('2d');

            // 底色
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 外框 (SDG 5 Red)
            ctx.strokeStyle = '#e5243b';
            ctx.lineWidth = 16;
            ctx.strokeRect(24, 24, canvas.width - 48, canvas.height - 48);

            // 內框
            ctx.strokeStyle = '#ffcc00';
            ctx.lineWidth = 4;
            ctx.strokeRect(40, 40, canvas.width - 80, canvas.height - 80);

            // 標題
            ctx.fillStyle = '#e5243b';
            ctx.font = "bold 44px 'Noto Sans TC', sans-serif";
            ctx.textAlign = 'center';
            ctx.fillText("SDGs 性別平權學習證書", canvas.width / 2, 130);

            ctx.fillStyle = '#666666';
            ctx.font = "22px 'Noto Sans TC', sans-serif";
            ctx.fillText("UN SDG Goal 5: Gender Equality", canvas.width / 2, 175);

            // 分隔線
            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(200, 210); ctx.lineTo(800, 210); ctx.stroke();

            // 內文
            ctx.fillStyle = '#1e293b';
            ctx.font = "28px 'Noto Sans TC', sans-serif";
            ctx.fillText("茲證明挑戰者於遊樂園情境題中表現卓越", canvas.width / 2, 290);

            ctx.fillStyle = '#059669';
            ctx.font = "bold 38px 'Noto Sans TC', sans-serif";
            ctx.fillText("榮獲最高等級：【平權達人】", canvas.width / 2, 360);

            ctx.fillStyle = '#475569';
            ctx.font = "20px 'Noto Sans TC', sans-serif";
            ctx.fillText("特頒此證以表彰對落實性別平等與尊重包容之傑出成果！", canvas.width / 2, 430);

            // 日期與認證章
            const today = new Date();
            const dateText = `發證日期：${today.getFullYear()} 年 ${today.getMonth() + 1} 月 ${today.getDate()} 日`;
            ctx.fillStyle = '#64748b';
            ctx.font = "18px 'Noto Sans TC', sans-serif";
            ctx.fillText(dateText, canvas.width / 2, 530);

            // 圓形印章
            ctx.beginPath(); ctx.arc(800, 520, 50, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(229, 36, 59, 0.1)"; ctx.fill();
            ctx.strokeStyle = '#e5243b'; ctx.lineWidth = 3; ctx.stroke();
            ctx.fillStyle = '#e5243b'; ctx.font = "bold 16px 'Noto Sans TC', sans-serif";
            ctx.fillText("SDGs 檢定", 800, 515); ctx.fillText("認證章", 800, 535);

            // 觸發圖片下載
            const imageURI = canvas.toDataURL('image/png');
            const link = document.createElement('a');
            link.download = "SDGs性別平權_平權達人學習證書.png";
            link.href = imageURI;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // 行動裝置 Touch Drag and Drop 支援
        function initTouchSupport() {
            let activeCard = null;
            let touchX = 0, touchY = 0;

            document.addEventListener('touchstart', (e) => {
                if (e.target.classList.contains('drag-card')) {
                    activeCard = e.target;
                    const touch = e.touches[0];
                    const rect = activeCard.getBoundingClientRect();
                    touchX = touch.clientX - rect.left;
                    touchY = touch.clientY - rect.top;
                    activeCard.style.position = 'fixed';
                    activeCard.style.zIndex = '1000';
                    activeCard.style.width = `${rect.width}px`;
                }
            }, { passive: false });

            document.addEventListener('touchmove', (e) => {
                if (activeCard) {
                    e.preventDefault();
                    const touch = e.touches[0];
                    activeCard.style.left = `${touch.clientX - touchX}px`;
                    activeCard.style.top = `${touch.clientY - touchY}px`;
                }
            }, { passive: false });

            document.addEventListener('touchend', (e) => {
                if (!activeCard) return;

                const touch = e.changedTouches[0];
                activeCard.style.display = 'none';
                const elemBelow = document.elementFromPoint(touch.clientX, touch.clientY);
                activeCard.style.display = '';

                activeCard.style.position = '';
                activeCard.style.zIndex = '';
                activeCard.style.left = '';
                activeCard.style.top = '';
                activeCard.style.width = '';

                if (elemBelow) {
                    const zone = elemBelow.closest('.drop-zone');
                    const source = elemBelow.closest('#cardSource');

                    if (zone) {
                        const zoneType = zone.classList.contains('equal') ? 'equal' : 'unequal';
                        const slot = (zoneType === 'equal') ? document.getElementById('zoneEqual') : document.getElementById('zoneUnequal');
                        slot.appendChild(activeCard);
                        userAssignments[activeCard.id] = zoneType;
                        playSfx('click');
                    } else if (source) {
                        source.appendChild(activeCard);
                        delete userAssignments[activeCard.id];
                        playSfx('click');
                    }
                }
                activeCard = null;
            });
        }

        // 滿分慶祝彩帶
        function startConfetti() {
            const canvas = document.getElementById('confettiCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#f43f5e', '#10b981', '#3b82f6', '#f59e0b', '#8b5cf6'];

            for (let i = 0; i < 120; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    vx: Math.random() * 4 - 2,
                    vy: Math.random() * 4 + 2,
                    rotation: Math.random() * 360
                });
            }

            function loop() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.x += p.vx; p.y += p.vy; p.rotation += 4;
                    if (p.y > canvas.height) { p.y = -10; p.x = Math.random() * canvas.width; }
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate((p.rotation * Math.PI) / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                    ctx.restore();
                });
                requestAnimationFrame(loop);
            }
            loop();
        }
    </script>
