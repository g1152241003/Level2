<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDGs 性別平權小達人 - 學習證書</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;600;800;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: #0f172a;
            color: #1e293b;
        }

        .font-serif-tc {
            font-family: 'Noto Serif TC', serif;
        }

        /* 證書卡片預覽容器 */
        .certificate-container {
            width: 100%;
            max-width: 900px;
            aspect-ratio: 1.414 / 1; /* A4 橫式比例 */
            background: #ffffff;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            background-image: 
                radial-gradient(#e5243b 0.5px, transparent 0.5px), 
                radial-gradient(#ffcc00 0.5px, #ffffff 0.5px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }

        /* 花紋金邊與 SDG 5 品牌框 */
        .cert-border-outer {
            border: 12px solid #e5243b;
        }
        .cert-border-inner {
            border: 3px double #d97706;
        }

        /* 鋼印 / 徽章 */
        .seal-badge {
            background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
            box-shadow: 0 8px 16px rgba(217, 119, 6, 0.4);
        }

        /* 列印專用 CSS 控制 (@media print) */
        @media print {
            @page {
                size: A4 landscape;
                margin: 0;
            }

            body {
                background: none !important;
                padding: 0 !important;
                margin: 0 !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            /* 隱藏非證書的 UI 元素 (輸入框, 按鈕, 提示語, 頁首頁尾) */
            .no-print {
                display: none !important;
            }

            .print-area {
                padding: 0 !important;
                margin: 0 !important;
                width: 100vw !important;
                height: 100vh !important;
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
            }

            .certificate-container {
                width: 100vw !important;
                height: 100vh !important;
                max-width: none !important;
                aspect-ratio: auto !important;
                box-shadow: none !important;
                border-radius: 0 !important;
            }
        }
    </style>
</head>
<body class="min-h-screen py-8 px-4 flex flex-col items-center justify-start">

    <!-- 控制介面區域 (列印時隱藏) -->
    <div class="no-print w-full max-w-4xl mb-6 space-y-4">
        <!-- 頁頭與返回 -->
        <div class="flex flex-col sm:flex-row items-center justify-between gap-4 bg-slate-800/90 backdrop-blur-md p-4 rounded-2xl border border-slate-700 shadow-lg text-white">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-rose-600 rounded-xl flex items-center justify-center text-xl font-black">
                    <i class="fas fa-certificate"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black text-rose-400">SDGs 性別平權小達人</h1>
                    <p class="text-xs text-slate-400">請填入姓名並點擊下載或列印學習證書</p>
                </div>
            </div>

            <!-- 操作按鈕群 -->
            <div class="flex items-center gap-3 w-full sm:w-auto justify-end">
                <button onclick="window.location.href='level2.html'" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm font-bold rounded-xl transition flex items-center gap-2">
                    <i class="fas fa-rotate-left"></i>
                    <span>重新挑戰</span>
                </button>
                <button onclick="handlePrint()" class="px-6 py-2.5 bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-500 hover:to-amber-600 text-slate-900 font-extrabold text-sm rounded-xl shadow-lg transition transform active:scale-95 flex items-center gap-2">
                    <i class="fas fa-file-pdf"></i>
                    <span>下載 / 列印證書 (PDF)</span>
                </button>
            </div>
        </div>

        <!-- 姓名輸入卡片 -->
        <div class="bg-slate-800/60 p-4 rounded-2xl border border-slate-700 shadow-md flex flex-col sm:flex-row items-center gap-4">
            <label for="userNameInput" class="text-white font-extrabold text-sm whitespace-nowrap flex items-center gap-2">
                <i class="fas fa-user-pen text-amber-400 text-base"></i>
                <span>受頒人姓名：</span>
            </label>
            <input 
                type="text" 
                id="userNameInput" 
                placeholder="請輸入您的姓名（例如：王小明）" 
                value="林小華"
                maxlength="15"
                class="w-full bg-slate-900 border-2 border-slate-600 focus:border-amber-400 text-amber-300 font-bold px-4 py-2 rounded-xl text-base outline-none transition"
                oninput="updateCertificateName()"
            />
            <span class="text-xs text-slate-400 whitespace-nowrap">
                <i class="fas fa-circle-info text-amber-400"></i> 輸入姓名後，證書將即時更新預覽
            </span>
        </div>
    </div>

    <!-- 證書本體區域 (列印主要區域) -->
    <main class="print-area w-full max-w-4xl flex items-center justify-center">
        <div class="certificate-container rounded-2xl overflow-hidden p-6 md:p-10 flex flex-col justify-between">
            
            <!-- 外框裝飾線 -->
            <div class="cert-border-outer h-full w-full rounded-xl p-3 flex flex-col justify-between relative bg-white/90 backdrop-blur-sm">
                <div class="cert-border-inner h-full w-full rounded-lg p-6 md:p-10 flex flex-col justify-between relative">
                    
                    <!-- 四角金屬邊角花紋 -->
                    <div class="absolute top-2 left-2 text-amber-600/40 text-2xl"><i class="fas fa-crown"></i></div>
                    <div class="absolute top-2 right-2 text-amber-600/40 text-2xl"><i class="fas fa-crown"></i></div>
                    <div class="absolute bottom-2 left-2 text-amber-600/40 text-2xl"><i class="fas fa-crown"></i></div>
                    <div class="absolute bottom-2 right-2 text-amber-600/40 text-2xl"><i class="fas fa-crown"></i></div>

                    <!-- 證書頂部標題 -->
                    <header class="text-center space-y-2 mt-2">
                        <div class="inline-flex items-center space-x-2 bg-rose-50 border border-rose-200 px-4 py-1 rounded-full text-rose-600 font-extrabold text-xs tracking-wider uppercase mb-1">
                            <i class="fas fa-globe"></i>
                            <span>UN Sustainable Development Goal 5</span>
                        </div>
                        <h2 class="text-3xl md:text-5xl font-black font-serif-tc text-rose-600 tracking-wider drop-shadow-sm">
                            學習證書
                        </h2>
                        <p class="text-xs md:text-sm font-bold text-amber-700 tracking-widest uppercase">
                            CERTIFICATE OF ACHIEVMENT
                        </p>
                    </header>

                    <!-- 證書主要授與內容 -->
                    <section class="text-center my-4 space-y-4">
                        <p class="text-slate-600 text-sm md:text-base font-bold">茲證明</p>
                        
                        <!-- 動態姓名展示區 -->
                        <div class="py-1">
                            <span id="certNameDisplay" class="text-3xl md:text-5xl font-black font-serif-tc text-slate-900 border-b-4 border-amber-400 px-8 py-1 inline-block min-w-[200px]">
                                林小華
                            </span>
                        </div>

                        <p class="text-slate-700 text-sm md:text-lg font-semibold leading-relaxed max-w-2xl mx-auto">
                            順利完成性別平權學習闖關，展現對多元包容與平等價值的深刻理解，特授予
                        </p>

                        <!-- 榮譽稱號 -->
                        <div class="py-2">
                            <span class="inline-block bg-gradient-to-r from-rose-500 via-rose-600 to-amber-500 text-white font-extrabold text-xl md:text-3xl px-8 py-2.5 rounded-2xl shadow-md tracking-wider border-2 border-amber-300">
                                🏆 「SDGs 性別平權小達人」
                            </span>
                        </div>
                    </section>

                    <!-- 證書底部發證資訊與印章 -->
                    <footer class="flex items-end justify-between border-t border-slate-200 pt-4 mt-2">
                        <!-- 發證日期 -->
                        <div class="text-left space-y-1">
                            <div class="text-xs text-slate-500 font-bold uppercase tracking-wider">Issue Date</div>
                            <div id="certDateDisplay" class="text-xs md:text-sm font-extrabold text-slate-800">
                                發證日期：2026 年 10 月 3 日
                            </div>
                        </div>

                        <!-- 中央印章/徽章 -->
                        <div class="seal-badge w-16 h-16 md:w-20 md:h-20 rounded-full flex flex-col items-center justify-center text-white border-4 border-amber-200 shadow-xl transform rotate-6">
                            <i class="fas fa-certificate text-lg md:text-2xl mb-0.5"></i>
                            <span class="text-[9px] md:text-[10px] font-black tracking-tighter uppercase">SDGs Goal 5</span>
                        </div>

                        <!-- 授權機構/認證單位 -->
                        <div class="text-right space-y-1">
                            <div class="text-xs text-slate-500 font-bold uppercase tracking-wider">Certified By</div>
                            <div class="text-xs md:text-sm font-black text-rose-600 flex items-center justify-end gap-1">
                                <i class="fas fa-shield-halved"></i>
                                <span>性別平權推動小組</span>
                            </div>
                        </div>
                    </footer>

                </div>
            </div>

        </div>
    </main>

    <script>
        // 初始化載入
        window.addEventListener('DOMContentLoaded', () => {
            setCurrentDate();
            updateCertificateName();
        });

        // 動態更新姓名預覽
        function updateCertificateName() {
            const inputVal = document.getElementById('userNameInput').value.trim();
            const displayElem = document.getElementById('certNameDisplay');
            
            if (inputVal === "") {
                displayElem.innerText = "受頒人姓名";
                displayElem.classList.add('text-slate-400');
            } else {
                displayElem.innerText = inputVal;
                displayElem.classList.remove('text-slate-400');
            }
        }

        // 自動取得並設置發證日期
        function setCurrentDate() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const day = now.getDate();
            document.getElementById('certDateDisplay').innerText = `發證日期：${year} 年 ${month} 月 ${day} 日`;
        }

        // 觸發系統列印（儲存 PDF / 列印）
        function handlePrint() {
            const nameInput = document.getElementById('userNameInput');
            if (!nameInput.value.trim()) {
                nameInput.value = "無名氏";
                updateCertificateName();
            }
            window.print();
        }
    </script>
</body>
</html>
