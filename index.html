        body {
            font-family: 'Noto Sans TC', sans-serif;
            user-select: none;
            touch-action: manipulation;
        }

        /* Village map container styling */
        .village-canvas-container {
            position: relative;
            width: 100%;
            max-width: 1024px;
            aspect-ratio: 16 / 9;
            margin: 0 auto;
            border-radius: 1.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            background-color: #7ec850;
        }

        /* House hovering and pulse animation */
        .hut-node {
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
        }
        .hut-node:hover {
            transform: scale(1.15) translateY(-5px);
            filter: drop-shadow(0 10px 12px rgba(0, 0, 0, 0.3));
        }

        /* Smoke particle animation for roofs */
        @keyframes smoke {
            0% { transform: translateY(0) scale(0.8); opacity: 0.8; }
            100% { transform: translateY(-20px) scale(1.8); opacity: 0; }
        }
        .smoke-particle {
            animation: smoke 2.5s infinite linear;
        }

        /* Floating bounce for roof badges */
        @keyframes floatBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .float-bounce {
            animation: floatBounce 2s infinite ease-in-out;
        }

        /* Modal pop animation */
        @keyframes modalPop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .modal-animated {
            animation: modalPop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Confetti piece styling */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f00;
            animation: fall 3s linear infinite;
        }
        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
            }
        }

        // Audio Synthesizer State (Web Audio API)
        let soundEnabled = true;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!soundEnabled) return;
            try {
                initAudio();
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'correct') {
                    // Happy ding-dong chord
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
                    osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                } else if (type === 'wrong') {
                    // Low buzz
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(180, now);
                    osc.frequency.setValueAtTime(130, now + 0.15);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                } else if (type === 'click') {
                    // Subtle click
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400, now);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'win') {
                    // Victory fanfare
                    const notes = [440, 554.37, 659.25, 880];
                    notes.forEach((freq, idx) => {
                        const subOsc = audioCtx.createOscillator();
                        const subGain = audioCtx.createGain();
                        subOsc.connect(subGain);
                        subGain.connect(audioCtx.destination);
                        subOsc.frequency.value = freq;
                        subGain.gain.setValueAtTime(0.2, now + idx * 0.12);
                        subGain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.3);
                        subOsc.start(now + idx * 0.12);
                        subOsc.stop(now + idx * 0.12 + 0.3);
                    });
                }
            } catch (e) {
                console.log("Audio playback error:", e);
            }
        }

                if (iconMob) iconMob.className = "fas fa-volume-high";
                if (text) text.innerText = "音效開啟";

                if (text) text.innerText = "音效靜音";

                {

        let currentLevel = 1; // 1 or 2
        let answeredHuts = {}; // e.g. {1: true, 2: false} (true = correct, false = wrong)
        let activeHutIndex = null;
        let correctCount = 0;

        // Coordinates for 10 Huts on the 1000x562.5 SVG Canvas
        const hutPositions = [
            { x: 150, y: 160, label: "1號小屋" },
            { x: 380, y: 130, label: "2號小屋" },
            { x: 620, y: 150, label: "3號小屋" },
            { x: 830, y: 180, label: "4號小屋" },
            { x: 220, y: 310, label: "5號小屋" },
            { x: 500, y: 280, label: "6號小屋" },
            { x: 760, y: 320, label: "7號小屋" },
            { x: 130, y: 440, label: "8號小屋" },
            { x: 420, y: 430, label: "9號小屋" },
            { x: 710, y: 440, label: "10號小屋" }
        ];

        function renderVillageMap() {
            const svg = document.getElementById('villageMapSvg');
            const isLevel2 = (currentLevel === 2);

            // Palette
            const bgGradStart = isLevel2 ? '#486581' : '#82c91e';
            const bgGradEnd = isLevel2 ? '#243b53' : '#5c940d';
            const pathColor = isLevel2 ? '#9fb3c8' : '#e9ecef';
            const treeColor = isLevel2 ? '#102a43' : '#2b8a3e';
            const roofColor = isLevel2 ? '#d9e2ec' : '#d97706';

            let svgContent = `
                <!-- Background Gradient -->
                <defs>
                    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="${bgGradStart}"/>
                        <stop offset="100%" stop-color="${bgGradEnd}"/>
                    </linearGradient>
                    <linearGradient id="riverGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#38bdf8"/>
                        <stop offset="100%" stop-color="#0284c7"/>
                    </linearGradient>
                </defs>
                <rect width="1000" height="562.5" fill="url(#bgGrad)"/>

                <!-- Winding Paths through Village -->
                <path d="M 50,200 Q 200,150 380,180 T 700,200 T 950,220" fill="none" stroke="${pathColor}" stroke-width="24" stroke-linecap="round" opacity="0.6"/>
                <path d="M 220,310 C 250,220 380,280 500,280 C 650,280 700,380 710,440" fill="none" stroke="${pathColor}" stroke-width="20" stroke-linecap="round" opacity="0.5"/>
                <path d="M 420,430 L 500,280 L 620,150" fill="none" stroke="${pathColor}" stroke-width="18" stroke-dasharray="10 10" opacity="0.5"/>

                <!-- Meandering River -->
                <path d="M -20,80 Q 250,300 400,100 T 1020,380" fill="none" stroke="url(#riverGrad)" stroke-width="32" opacity="0.8"/>
                
                <!-- Wooden Bridges -->
                <rect x="235" y="165" width="40" height="20" fill="#78350f" rx="3" transform="rotate(25, 255, 175)"/>
                <rect x="800" y="305" width="45" height="22" fill="#78350f" rx="3" transform="rotate(-15, 822, 316)"/>

                <!-- Scenic Trees & Decorative Elements -->
                <!-- Forest Cluster Top Left -->
                <circle cx="60" cy="80" r="35" fill="${treeColor}" opacity="0.9"/>
                <circle cx="95" cy="110" r="28" fill="${treeColor}" opacity="0.8"/>
                <circle cx="50" cy="130" r="30" fill="${treeColor}" opacity="0.85"/>
                
                <!-- Forest Cluster Right Side -->
                <circle cx="920" cy="90" r="40" fill="${treeColor}" opacity="0.9"/>
                <circle cx="960" cy="140" r="30" fill="${treeColor}" opacity="0.8"/>
                
                <!-- Center Trees -->
                <circle cx="310" cy="380" r="25" fill="${treeColor}"/>
                <circle cx="600" cy="480" r="32" fill="${treeColor}"/>
                <circle cx="880" cy="460" r="28" fill="${treeColor}"/>
            `;

            svg.innerHTML = svgContent;

            // Render interactive HTML Hut layer over SVG
            renderHutOverlays();
        }

        function renderHutOverlays() {
            const overlay = document.getElementById('hutsOverlay');
            overlay.innerHTML = '';

            hutPositions.forEach((pos, index) => {
                const hutNumber = index + 1;
                const status = answeredHuts[hutNumber]; // true, false, or undefined

                // Badge styling depending on answer state
                let badgeBg = "bg-amber-500 text-white";
                let badgeIcon = `<i class="fas fa-question text-xs"></i>`;
                let glowStyle = "shadow-md";

                if (status === true) {
                    badgeBg = "bg-emerald-500 text-white ring-4 ring-emerald-300/50";
                    badgeIcon = `<i class="fas fa-check text-xs"></i>`;
                    glowStyle = "shadow-emerald-500/50 shadow-lg";
                } else if (status === false) {
                    badgeBg = "bg-rose-500 text-white ring-4 ring-rose-300/50";
                    badgeIcon = `<i class="fas fa-times text-xs"></i>`;
                    glowStyle = "shadow-rose-500/50 shadow-lg";
                }

                const isLevel2 = (currentLevel === 2);
                const hutWallColor = isLevel2 ? "#94a3b8" : "#fde047";
                const roofColor = isLevel2 ? "#e2e8f0" : "#d97706";

                const hutElem = document.createElement('div');
                hutElem.className = `hut-node absolute transform -translate-x-1/2 -translate-y-1/2 flex flex-col items-center group`;
                hutElem.style.left = `${(pos.x / 1000) * 100}%`;
                hutElem.style.top = `${(pos.y / 562.5) * 100}%`;
                hutElem.onclick = () => openQuestionModal(hutNumber);

                hutElem.innerHTML = `
                    <!-- Floating Indicator Pin -->
                    <div class="float-bounce mb-1 flex items-center justify-center">
                        <span class="${badgeBg} ${glowStyle} px-2 py-0.5 rounded-full text-xs font-bold flex items-center gap-1 shadow-md transition-all">
                            ${badgeIcon}
                            <span>${pos.label}</span>
                        </span>
                    </div>

                    <!-- Thatched Hut Graphic (SVG) -->
                    <div class="relative w-12 h-12 md:w-16 md:h-16">
                        <!-- Smoke from Chimney -->
                        <div class="absolute -top-3 right-2 w-2 h-2 bg-slate-200/80 rounded-full smoke-particle"></div>

                        <svg viewBox="0 0 100 100" class="w-full h-full drop-shadow-md">
                            <!-- Walls -->
                            <rect x="20" y="45" width="60" height="45" rx="4" fill="${hutWallColor}" stroke="#78350f" stroke-width="3"/>
                            <!-- Door -->
                            <rect x="40" y="60" width="20" height="30" rx="2" fill="#78350f"/>
                            <!-- Window -->
                            <circle cx="32" cy="58" r="6" fill="#fef08a" stroke="#78350f" stroke-width="2"/>
                            <circle cx="68" cy="58" r="6" fill="#fef08a" stroke="#78350f" stroke-width="2"/>
                            <!-- Thatched Roof -->
                            <path d="M 10,48 L 50,10 L 90,48 Z" fill="${roofColor}" stroke="#78350f" stroke-width="4" stroke-linejoin="round"/>
                            <!-- Roof Lines Pattern -->
                            <path d="M 25,35 L 50,15 L 75,35" fill="none" stroke="#b45309" stroke-width="2"/>
                        </svg>
                    </div>
                `;

                overlay.appendChild(hutElem);
            });
        }

        function openQuestionModal(hutNumber) {
            playSound('click');
            activeHutIndex = hutNumber;
            const currentQuestions = (currentLevel === 1) ? questionsDatabase.level1 : questionsDatabase.level2;
            const qData = currentQuestions[hutNumber - 1];

            document.getElementById('modalHutBadge').innerText = `第 ${currentLevel} 關 - 茅草屋 #${hutNumber}`;
            document.getElementById('questionTitle').innerText = `${hutNumber}. ${qData.question}`;

            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';

            const feedbackBox = document.getElementById('feedbackBox');
            feedbackBox.className = "hidden";

            const nextBtn = document.getElementById('nextQuestionBtn');
            nextBtn.className = "hidden";

            const isAlreadyAnswered = answeredHuts.hasOwnProperty(hutNumber);

            qData.options.forEach((optText, optIdx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 rounded-xl border-2 transition font-semibold text-sm md:text-base flex items-center justify-between group
                    ${isAlreadyAnswered ? 'cursor-not-allowed opacity-80' : 'hover:border-rose-400 hover:bg-slate-700/80 active:scale-98'}
                    bg-slate-700/50 border-slate-600 text-slate-100`;
                
                btn.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="w-7 h-7 rounded-lg bg-slate-800 border border-slate-600 group-hover:border-rose-400 flex items-center justify-center text-xs font-bold text-rose-400">
                            ${String.fromCharCode(65 + optIdx)}
                        </span>
                        <span>${optText}</span>
                    </div>
                    <i class="fas fa-chevron-right text-slate-500 group-hover:text-rose-400 text-xs"></i>
                `;

                if (!isAlreadyAnswered) {
                    btn.onclick = () => submitAnswer(hutNumber, optIdx, qData);
                } else {
                    btn.disabled = true;
                    if (optIdx === qData.answer) {
                        btn.classList.add('border-emerald-500', 'bg-emerald-950/40');
                    }
                }

                optionsContainer.appendChild(btn);
            });

            // If already answered, show previous result
            if (isAlreadyAnswered) {
                showFeedback(answeredHuts[hutNumber], qData);
            }

            document.getElementById('questionModal').classList.remove('hidden');
        }

        function submitAnswer(hutNumber, selectedIndex, qData) {
            const isCorrect = (selectedIndex === qData.answer);
            answeredHuts[hutNumber] = isCorrect;

            if (isCorrect) {
                correctCount++;
                playSound('correct');
            } else {
                playSound('wrong');
            }

            updateScoreDisplay();
            renderHutOverlays();
            showFeedback(isCorrect, qData);

            // Check if all 10 huts in the level are completed
            if (Object.keys(answeredHuts).length === 10) {
                setTimeout(() => {
                    closeModal();
                    evaluateLevelCompletion();
                }, 1800);
            }
        }

        function showFeedback(isCorrect, qData) {
            const feedbackBox = document.getElementById('feedbackBox');
            const feedbackIcon = document.getElementById('feedbackIcon');
            const feedbackTitle = document.getElementById('feedbackTitle');
            const feedbackText = document.getElementById('feedbackText');
            const nextBtn = document.getElementById('nextQuestionBtn');

            feedbackBox.classList.remove('hidden');

            if (isCorrect) {
                feedbackBox.className = "p-4 rounded-xl mb-4 font-semibold text-sm flex items-start gap-3 bg-emerald-900/60 border border-emerald-500 text-emerald-200";
                feedbackIcon.className = "fas fa-circle-check text-emerald-400 text-2xl mt-0.5";
                feedbackTitle.innerText = "答對了！太棒了！";
            } else {
                feedbackBox.className = "p-4 rounded-xl mb-4 font-semibold text-sm flex items-start gap-3 bg-rose-900/60 border border-rose-500 text-rose-200";
                feedbackIcon.className = "fas fa-circle-xmark text-rose-400 text-2xl mt-0.5";
                feedbackTitle.innerText = `答錯了！正確答案是：（${String.fromCharCode(65 + qData.answer)}）`;
            }

            feedbackText.innerText = qData.explanation;

            nextBtn.classList.remove('hidden');
            nextBtn.className = "w-full py-3 bg-slate-700 hover:bg-slate-600 text-white font-bold rounded-xl shadow transition";
        }

        function closeModal() {
            playSound('click');
            document.getElementById('questionModal').classList.add('hidden');
        }

        function updateScoreDisplay() {
            const scoreText = document.getElementById('scoreText');
            scoreText.innerText = `${correctCount} / 10`;
            
            const currentLevelBadge = document.getElementById('currentLevelBadge');
            currentLevelBadge.innerText = `關卡 ${currentLevel}`;
        }

        function evaluateLevelCompletion() {
            const resultModal = document.getElementById('resultModal');
            const resultIconBox = document.getElementById('resultIconBox');
            const resultIcon = document.getElementById('resultIcon');
            const resultTitle = document.getElementById('resultTitle');
            const resultSubtitle = document.getElementById('resultSubtitle');
            const resultScore = document.getElementById('resultScore');
            const actionContainer = document.getElementById('resultActionContainer');

            resultScore.innerText = `${correctCount} / 10`;
            actionContainer.innerHTML = '';

            const isPass = correctCount >= 8;

            if (isPass) {
                playSound('win');
                resultIconBox.className = "w-24 h-24 mx-auto rounded-full flex items-center justify-center mb-4 text-4xl shadow-lg border-4 bg-emerald-900/80 border-emerald-400 text-emerald-300";
                resultIcon.className = "fas fa-trophy animate-bounce";

                if (currentLevel === 1) {
                    resultTitle.innerText = "恭喜通關第一關！";
                    resultSubtitle.innerText = "您展現了卓越的 SDGs 性別平權觀念！準備好挑戰難度更高的第二村莊了嗎？";

                    const nextLevelBtn = document.createElement('button');
                    nextLevelBtn.className = "w-full py-3.5 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-black rounded-xl shadow-lg text-lg transition transform active:scale-95 flex items-center justify-center gap-2";
                    nextLevelBtn.innerHTML = `<span>前往下一關 (Level 2)</span> <i class="fas fa-arrow-right"></i>`;
                    nextLevelBtn.onclick = () => loadLevel(2);
                    actionContainer.appendChild(nextLevelBtn);
                } else {
                    // Level 2 Grand Final Victory
                    resultTitle.innerText = "榮獲「SDGs 性別平權大使」！";
                    resultSubtitle.innerText = "太傑出了！您已全面解鎖兩大關卡，具備極高的性別平權意識與永續發展知能！";

                    const restartAllBtn = document.createElement('button');
                    restartAllBtn.className = "w-full py-3.5 bg-gradient-to-r from-rose-500 to-pink-600 hover:from-rose-600 hover:to-pink-700 text-white font-black rounded-xl shadow-lg text-lg transition transform active:scale-95 flex items-center justify-center gap-2";
                    restartAllBtn.innerHTML = `<i class="fas fa-redo"></i> <span>重新體驗遊戲</span>`;
                    restartAllBtn.onclick = () => loadLevel(1);
                    actionContainer.appendChild(restartAllBtn);

                    createConfettiEffect();
                }
            } else {
                playSound('wrong');
                resultIconBox.className = "w-24 h-24 mx-auto rounded-full flex items-center justify-center mb-4 text-4xl shadow-lg border-4 bg-rose-900/80 border-rose-400 text-rose-300";
                resultIcon.className = "fas fa-heart-crack";

                resultTitle.innerText = "挑戰失敗！";
                resultSubtitle.innerText = "性別平權意識仍需努力！答對題數需達到 8 題以上才能通關喔！";

                const retryBtn = document.createElement('button');
                retryBtn.className = "w-full py-3.5 bg-gradient-to-r from-rose-500 to-pink-600 hover:from-rose-600 hover:to-pink-700 text-white font-black rounded-xl shadow-lg text-lg transition transform active:scale-95 flex items-center justify-center gap-2";
                retryBtn.innerHTML = `<i class="fas fa-rotate-right"></i> <span>重新挑戰關卡 ${currentLevel}</span>`;
                retryBtn.onclick = () => {
                    // Reload page or reset level
                    if (currentLevel === 1) {
                        window.location.reload();
                    } else {
                        loadLevel(2);
                    }
                };
                actionContainer.appendChild(retryBtn);
            }

            resultModal.classList.remove('hidden');
        }

        function loadLevel(levelNum) {
            playSound('click');
            currentLevel = levelNum;
            answeredHuts = {};
            correctCount = 0;

            document.getElementById('resultModal').classList.add('hidden');
            updateScoreDisplay();
            renderVillageMap();
        }

        /* Confetti Effect for Final Game Victory */
        function createConfettiEffect() {
            const colors = ['#f43f5e', '#10b981', '#3b82f6', '#f59e0b', '#8b5cf6'];
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                confetti.style.opacity = Math.random();
                document.body.appendChild(confetti);

                setTimeout(() => confetti.remove(), 4000);
            }
        }

        /* Initial Game Launch on Window Load */
        window.onload = function () {
            renderVillageMap();
            updateScoreDisplay();
        };
    </script>
